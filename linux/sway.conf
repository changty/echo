# Echo — sway integration
# Append to ~/.config/sway/config (or include this file).

# `echo` is a shell builtin; sway runs exec through sh, so use `echo-llm`.
bindsym Mod1+space exec echo-llm --toggle
bindsym Mod1+Shift+p exec echo-llm --action=proofread
bindsym Mod1+Shift+e exec echo-llm --action=translate_en

# Echo opens two windows and Wayland gives both the same app_id (`echo`) —
# app_id is per-process, not per-window. Criteria that must hit only one of them
# also match on the title: "Echo" is the launcher, "Echo Settings" the settings
# window.
for_window [app_id="echo"] floating enable, border none
for_window [class="echo"]  floating enable, border none

# `sticky enable` is deliberately not applied to the app_id: sticky windows are
# drawn above ordinary ones, so making both windows sticky leaves Settings
# behind the launcher. Scope it to the launcher if you want Echo to follow you
# across workspaces:
# for_window [app_id="echo" title="^Echo$"] sticky enable

# No `resize set` on purpose: Echo sizes itself to fit its content, and Settings
# opens at up to 90% of the work area. Forcing a size pins the window, leaving
# the content scrolling inside a 320px slit and Settings clipped.

exec_always echo-llm --hide
