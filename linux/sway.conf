# Echo — sway integration
# Append to ~/.config/sway/config (or include this file).

# `echo` is a shell builtin; sway runs exec through sh, so use `echo-llm`.
bindsym Mod1+space exec echo-llm --toggle
bindsym Mod1+Shift+p exec echo-llm --action=proofread
bindsym Mod1+Shift+e exec echo-llm --action=translate_en

# No `resize set` on purpose: Echo sizes itself to fit its content, and grows to
# most of the work area while Settings is open. Forcing a size pins the window,
# leaving the content scrolling inside a 320px slit and Settings clipped.
for_window [app_id="echo"] floating enable, sticky enable, border none
for_window [class="echo"]  floating enable, sticky enable, border none

exec_always echo-llm --hide
