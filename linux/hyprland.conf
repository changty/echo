# Echo — Hyprland integration
# Source this from ~/.config/hypr/hyprland.conf:
#     source = /path/to/echo/linux/hyprland.conf

# 1. The hotkey.
# Electron's own global shortcut is an X11 key grab, so on Wayland it only fires
# while an X11 window happens to have focus. Letting Hyprland own the binding is
# the only approach that works every time.
#
# NOTE: do not name the binary `echo` — that is a POSIX shell builtin and
# Hyprland runs exec lines through /bin/sh, so `echo --toggle` would just print
# "--toggle". Use the packaged `echo-llm` name or an absolute path.
bind = ALT, SPACE, exec, echo-llm --toggle

# Optional: jump straight to an action on the clipboard, no menu step.
bind = ALT SHIFT, P, exec, echo-llm --action=proofread
bind = ALT SHIFT, E, exec, echo-llm --action=translate_en
bind = ALT SHIFT, S, exec, echo-llm --action=summarize
# Any custom action you add in Settings works here too, by its id:
# bind = ALT SHIFT, C, exec, echo-llm --action=commit

# 2. Window rules.
# Without these Hyprland tiles the launcher like an ordinary window, which
# destroys the whole Spotlight effect.
windowrulev2 = float,       class:^(echo)$
windowrulev2 = center,      class:^(echo)$
windowrulev2 = pin,         class:^(echo)$
windowrulev2 = noborder,    class:^(echo)$
windowrulev2 = noanim,      class:^(echo)$
windowrulev2 = stayfocused, class:^(echo)$

# Deliberately no `size` rule. Echo resizes itself to fit its content, and grows
# to most of the work area while Settings is open. A fixed size pins the window,
# so the content ends up scrolling inside a 320px slit and Settings is clipped.

# 3. Autostart so the hotkey is live from login.
exec-once = echo-llm --hide
