# Echo — Hyprland integration
# Source this from ~/.config/hypr/hyprland.conf:
#     source = /path/to/echo/linux/hyprland.conf
#
# If your Hyprland config is the Lua flavour (Omarchy 3+ ships
# ~/.config/hypr/hyprland.lua), use linux/hyprland.lua instead — a `source =`
# line cannot pull this file into a Lua config.

# 1. The hotkey.
# Electron's own global shortcut is an X11 key grab, so on Wayland it only fires
# while an X11 window happens to have focus. Letting Hyprland own the binding is
# the only approach that works every time.
#
# NOTE: do not name the binary `echo` — that is a POSIX shell builtin and
# Hyprland runs exec lines through /bin/sh, so `echo --toggle` would just print
# "--toggle". Use the packaged `echo-llm` name or an absolute path.
bind = ALT, SPACE, exec, echo-llm --toggle

# Optional: jump straight to an action on the clipboard, no menu step.
bind = ALT SHIFT, P, exec, echo-llm --action=proofread
bind = ALT SHIFT, E, exec, echo-llm --action=translate_en
bind = ALT SHIFT, S, exec, echo-llm --action=summarize
# Any custom action you add in Settings works here too, by its id:
# bind = ALT SHIFT, C, exec, echo-llm --action=commit

# 2. Window rules.
# Without these Hyprland tiles the launcher like an ordinary window, which
# destroys the whole Spotlight effect.
#
# Echo opens two windows and Wayland gives both the same app_id (`echo`) —
# app_id is per-process, not per-window. Rules that must apply to only one of
# them are therefore matched on the title as well:
#
#     title:^(Echo)$            the launcher
#     title:^(Echo Settings)$   the settings window
windowrulev2 = float,    class:^(echo)$
windowrulev2 = center,   class:^(echo)$
windowrulev2 = noborder, class:^(echo)$
windowrulev2 = noanim,   class:^(echo)$

# Deliberately NO `stayfocused` rule. It looks right for a launcher — it stops
# the window losing focus — but it pins focus to whichever Echo window matched
# first, so opening Settings gives you a form that will not accept a single
# keystroke. Use Settings → "Hide when the window loses focus" instead, which
# Echo applies to the launcher only.

# Same reasoning for `pin`: pinned windows sit above unpinned ones, so pinning
# the launcher buries Settings behind it. Pin the launcher alone if you want it
# to follow you across workspaces.
# windowrulev2 = pin, class:^(echo)$, title:^(Echo)$

# Deliberately no `size` rule. Echo resizes itself to fit its content, and
# Settings opens at up to 90% of the work area. A fixed size pins the window, so
# the content ends up scrolling inside a 320px slit and Settings is clipped.

# 3. Autostart so the hotkey is live from login.
exec-once = echo-llm --hide
