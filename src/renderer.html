<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Echo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="text-zinc-100">
    <div
      id="shell"
      class="w-full backdrop-blur-2xl saturate-125 bg-zinc-900/85 rounded-2xl shadow-2xl p-3"
    >
      <div id="bar" class="flex justify-between items-center gap-2 px-2.5 py-1.5">
        <span id="brand" class="font-bold tracking-wide opacity-90 shrink-0">⌘ Echo</span>
        <div id="actions" class="flex items-center flex-wrap justify-end gap-2"></div>
        <button
          id="btn-settings"
          title="Settings"
          class="btn shrink-0 w-9 text-center p-1.5"
        >
          ⚙︎
        </button>
      </div>

      <div id="content" class="px-2.5 pb-2.5">
        <!-- Everything that decides how tall the window should be lives in here.
             #content itself is stretched by flexbox, so its own height says nothing;
             this wrapper's natural height is what the autosizer measures. -->
        <div id="content-inner">
          <div
            id="platform-banner"
            hidden
            class="mb-2 rounded-xl border border-amber-400/30 bg-amber-400/10 px-3 py-2 text-xs text-amber-100"
          >
            <div class="flex items-start justify-between gap-3">
              <div id="banner-text" class="leading-5"></div>
              <button id="banner-dismiss" class="btn shrink-0 py-0.5" type="button">
                Dismiss
              </button>
            </div>
          </div>

          <div
            id="onboarding"
            hidden
            class="mb-2 rounded-xl border border-accent/30 bg-accent/10 px-3 py-2 text-xs leading-5"
          >
            <div class="flex items-center justify-between gap-3">
              <div>
                <strong>No provider configured yet.</strong>
                Add an OpenAI key, point Echo at a local Ollama, or use any
                OpenAI-compatible endpoint.
              </div>
              <button id="onboard-open" class="btn shrink-0 py-0.5" type="button">
                Open Settings
              </button>
            </div>
          </div>

          <div
            id="error"
            hidden
            class="mb-2 rounded-xl border border-red-400/30 bg-red-400/10 px-3 py-2 text-xs text-red-100"
          >
            <div class="flex items-start justify-between gap-3">
              <div id="error-text" class="leading-5 break-words"></div>
              <button id="error-dismiss" class="btn shrink-0 py-0.5" type="button">
                ✕
              </button>
            </div>
          </div>

          <!-- Shown once a run has produced (or is producing) a result. -->
          <div
            id="viewbar"
            hidden
            class="mb-2 flex items-center justify-between gap-2 text-xs"
          >
            <div class="flex items-center gap-1">
              <button id="view-original" class="btn py-0.5" type="button">
                Original
              </button>
              <button id="view-result" class="btn py-0.5" type="button">
                Result
              </button>
              <span id="run-status" class="ml-2 text-zinc-400"></span>
            </div>
            <div class="flex items-center gap-1">
              <button id="btn-cancel" hidden class="btn py-0.5" type="button">
                Cancel
              </button>
              <button id="btn-retry" class="btn py-0.5" type="button">Retry</button>
              <button id="btn-copy" class="btn py-0.5" type="button">Copy</button>
              <button id="btn-paste" hidden class="btn py-0.5" type="button">
                Paste back
              </button>
            </div>
          </div>

          <textarea
            id="input"
            placeholder="Paste or type here…"
            class="w-full h-56 p-3.5 rounded-xl border border-white/10 bg-white/5 text-zinc-100 resize-none text-[15px] leading-6"
          ></textarea>

          <div id="imagePreview" hidden>
            <div class="flex items-center mt-2.5 gap-2">
              <img
                id="img"
                alt="clipboard image"
                class="h-12 rounded-lg border border-white/10"
              />
              <span class="hint text-xs text-zinc-400"
                >Image attached from clipboard</span
              >
            </div>
          </div>

          <div id="footer" class="flex justify-between mt-2 text-xs text-zinc-400">
            <span id="footer-hint">Ctrl/⌘+Enter Run · Ctrl/⌘+K Actions · Esc Close</span>
            <span id="provider"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Command palette -->
    <dialog
      id="palette"
      class="border border-white/15 bg-zinc-900/95 text-zinc-100 rounded-2xl p-3 w-[520px]"
    >
      <input
        id="palette-input"
        placeholder="Run an action…"
        class="w-full px-2.5 py-2 rounded-lg bg-white/10 border border-white/10 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-accent/60"
      />
      <div id="palette-list" class="mt-2 max-h-72 overflow-auto space-y-1"></div>
    </dialog>


    <!-- Generic tiny prompt -->
    <dialog
      id="promptDlg"
      class="border border-white/15 bg-zinc-900/95 text-zinc-100 rounded-2xl p-4 w-[420px]"
    >
      <form method="dialog" id="promptForm">
        <h3 id="promptTitle" class="text-base font-semibold">Input</h3>
        <p class="text-xs text-zinc-400" id="promptHelp"></p>
        <input
          id="promptInput"
          placeholder=""
          class="mt-2 w-full px-2.5 py-2 rounded-lg bg-white/10 border border-white/10 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-accent/60 focus:border-accent/40"
        />
        <menu class="flex justify-end gap-2 mt-3">
          <button id="promptOk" type="submit" class="btn" value="ok" autofocus>Ok</button>
          <button id="promptCancel" type="submit" class="btn" value="cancel">Cancel</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
